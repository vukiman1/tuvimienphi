packages:
  - 'apps/*'
  - 'packages/*'
  - 'packages/backend/*'
  - 'packages/shared/*'

# pnpm 10 no longer reads the "pnpm" field in package.json — these settings live here.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@scarf/scarf'
  - '@sentry-internal/node-cpu-profiler'
  - '@sentry/node-cpu-profiler'
  - '@swc/core'
  - 'argon2'
  - 'less'
  - 'msgpackr-extract'
  - 'nx'
  - 'unrs-resolver'

overrides:
  multer: '^2.2.0'
  js-yaml: '^4.2.0'
  qs: '^6.15.2'
  undici: '^7.28.0'
  tmp: '^0.2.7'
  piscina: '^4.9.3'
  form-data: '^4.0.6'
  launch-editor: '^2.14.1'
  webpack-dev-server: '^5.2.5'
  'http-proxy-middleware@^2': '^2.0.10'
  'http-proxy-middleware@^3': '^3.0.7'
  'body-parser@^2': '^2.3.0'
  seroval: '~1.5.6'
  seroval-plugins: '~1.5.6'
