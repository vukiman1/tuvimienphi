name: Deploy Frontend

on:
  workflow_run:
    workflows:
      - Push to dev
    types:
      - completed
    branches:
      - dev
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on dev to deploy (full or short SHA). Leave empty for the newest commit on dev.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOPS_VERSION: v3.13.3
  SOPS_LINUX_AMD64_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
  VERCEL_CLI_VERSION: 65.16.0
  VERCEL_ENV_SOURCE: origin/dev:vercel.enc.env

jobs:
  deploy:
    name: deploy ${{ matrix.app }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: vps-sieu-toc-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frontend
            project_id_key: VERCEL_FRONTEND_PROJECT_ID
          - app: dashboard
            project_id_key: VERCEL_DASHBOARD_PROJECT_ID
    concurrency:
      group: deploy-frontend-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Resolve the commit to deploy
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet --no-tags origin '+refs/heads/dev:refs/remotes/origin/dev'
          target="${RUN_COMMIT:-${REQUESTED_COMMIT:-origin/dev}}"
          if ! commit="$(git rev-parse --verify --quiet "${target}^{commit}")"; then
            echo "::error::${target} is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/dev; then
            echo "::error::${commit} is not on dev"
            exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "Deploying ${commit}"

      - name: Decrypt the Vercel credentials
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          PROJECT_ID_KEY: ${{ matrix.project_id_key }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "::error::Set SOPS_AGE_KEY on the vps-sieu-toc-production environment; ${VERCEL_ENV_SOURCE} cannot be decrypted without it"
            exit 1
          fi

          sops_bin="${RUNNER_TEMP}/sops"
          curl --fail --silent --show-error --location --output "$sops_bin" \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_LINUX_AMD64_SHA256}  ${sops_bin}" | sha256sum --check --status
          chmod +x "$sops_bin"

          umask 077
          rendered="${RUNNER_TEMP}/vercel.env"
          git show "$VERCEL_ENV_SOURCE" \
            | "$sops_bin" decrypt --input-type dotenv --output-type dotenv /dev/stdin > "$rendered"

          value_of() {
            sed -n "s/^$1=//p" "$rendered" | head -n 1
          }

          token="$(value_of VERCEL_TOKEN)"
          org_id="$(value_of VERCEL_ORG_ID)"
          project_id="$(value_of "$PROJECT_ID_KEY")"
          rm -f "$rendered"

          missing=()
          for pair in "VERCEL_TOKEN=${token}" "VERCEL_ORG_ID=${org_id}" "${PROJECT_ID_KEY}=${project_id}"; do
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = 'replace-me' ]; then
              missing+=("${pair%%=*}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Fill ${missing[*]} in vercel.enc.env (sops edit vercel.enc.env)"
            exit 1
          fi

          echo "::add-mask::${token}"
          {
            echo "VERCEL_TOKEN=${token}"
            echo "VERCEL_ORG_ID=${org_id}"
            echo "VERCEL_PROJECT_ID=${project_id}"
          } >> "$GITHUB_ENV"

      - name: Deploy to Vercel production
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --yes --token "$VERCEL_TOKEN"
