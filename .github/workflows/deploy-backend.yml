name: Deploy Backend

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on dev to deploy (full or short SHA). Leave empty for the newest commit on dev that has a published image.
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: vps-sieu-toc-production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - name: Check the deploy settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          missing_secrets=()
          for name in VPS_HOST VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing_secrets+=("$name")
          done
          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            echo "::error::Set ${missing_secrets[*]} as secrets of the vps-sieu-toc-production environment"
          fi
          if [ -z "$VPS_USER" ]; then
            echo "::error::Set VPS_USER as a variable of the vps-sieu-toc-production environment"
          fi
          if [ "${#missing_secrets[@]}" -gt 0 ] || [ -z "$VPS_USER" ]; then
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image to deploy
        id: target
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/tuvimienphi-backend
          NEWEST_SEARCH_DEPTH: 30
        run: |
          image_for() {
            echo "${IMAGE_REPOSITORY}:sha-${1:0:7}"
          }
          is_published() {
            docker buildx imagetools inspect "$(image_for "$1")" > /dev/null 2>&1
          }

          if [ -n "$REQUESTED_COMMIT" ]; then
            if ! commit="$(git rev-parse --verify --quiet "${REQUESTED_COMMIT}^{commit}")"; then
              echo "::error::${REQUESTED_COMMIT} is not a commit in this repository"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$commit" origin/dev; then
              echo "::error::${commit} is not on dev, so it has no published image"
              exit 1
            fi
            if ! is_published "$commit"; then
              echo "::error::$(image_for "$commit") is not on GHCR; publish-image.yml has not built this commit"
              exit 1
            fi
          else
            commit=''
            for candidate in $(git rev-list --max-count="$NEWEST_SEARCH_DEPTH" origin/dev); do
              if is_published "$candidate"; then
                commit="$candidate"
                break
              fi
            done
            if [ -z "$commit" ]; then
              echo "::error::None of the last ${NEWEST_SEARCH_DEPTH} commits on dev has a published image"
              exit 1
            fi
          fi

          {
            echo "commit=${commit}"
            echo "image=$(image_for "$commit")"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/tuvimienphi' }}
          IMAGE: ${{ steps.target.outputs.image }}
          COMMIT: ${{ steps.target.outputs.commit }}
          REPOSITORY: ${{ github.repository }}
        run: |
          remote_command="bash -s -- $(printf '%q ' "$IMAGE" "$COMMIT" "$VPS_DEPLOY_PATH" "$REPOSITORY")"
          ssh -i ~/.ssh/deploy_key -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            "${VPS_USER}@${VPS_HOST}" "$remote_command" < tools/vps/deploy-backend.sh

      - name: Report the deploy
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          {
            echo '### Deployed backend'
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${COMMIT}\`"
            echo
            echo 'To roll back, run this workflow by hand with an earlier commit from dev.'
          } >> "$GITHUB_STEP_SUMMARY"
