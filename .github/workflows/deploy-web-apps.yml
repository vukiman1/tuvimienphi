name: Deploy Web Apps

on:
  workflow_run:
    workflows:
      - Push to dev
    types:
      - completed
    branches:
      - dev
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on dev to deploy (full or short SHA). Leave empty for the newest commit on dev.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SOPS_VERSION: v3.13.3
  SOPS_LINUX_AMD64_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
  WRANGLER_VERSION: 4.162.0
  CLOUDFLARE_ENV_SOURCE: origin/dev:cloudflare.enc.env

jobs:
  deploy:
    name: deploy ${{ matrix.app }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: vps-sieu-toc-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frontend
            project: '@org/frontend'
            prerender: true
          - app: dashboard
            project: '@org/dashboard'
            prerender: false
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Resolve the commit to deploy
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          RUN_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet --no-tags origin '+refs/heads/dev:refs/remotes/origin/dev'
          target="${RUN_COMMIT:-${REQUESTED_COMMIT:-origin/dev}}"
          if ! commit="$(git rev-parse --verify --quiet "${target}^{commit}")"; then
            echo "::error::${target} is not a commit in this repository"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/dev; then
            echo "::error::${commit} is not on dev"
            exit 1
          fi
          git checkout --quiet --detach "$commit"
          echo "Deploying ${commit}"

      - name: Decrypt the Cloudflare credentials
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          if [ -z "$SOPS_AGE_KEY" ]; then
            echo "::error::Set SOPS_AGE_KEY on the vps-sieu-toc-production environment; ${CLOUDFLARE_ENV_SOURCE} cannot be decrypted without it"
            exit 1
          fi

          sops_bin="${RUNNER_TEMP}/sops"
          curl --fail --silent --show-error --location --output "$sops_bin" \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_LINUX_AMD64_SHA256}  ${sops_bin}" | sha256sum --check --status
          chmod +x "$sops_bin"

          umask 077
          rendered="${RUNNER_TEMP}/cloudflare.env"
          git show "$CLOUDFLARE_ENV_SOURCE" \
            | "$sops_bin" decrypt --input-type dotenv --output-type dotenv /dev/stdin > "$rendered"

          value_of() {
            sed -n "s/^$1=//p" "$rendered" | head -n 1
          }

          token="$(value_of CLOUDFLARE_API_TOKEN)"
          account_id="$(value_of CLOUDFLARE_ACCOUNT_ID)"
          rm -f "$rendered"

          missing=()
          for pair in "CLOUDFLARE_API_TOKEN=${token}" "CLOUDFLARE_ACCOUNT_ID=${account_id}"; do
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = 'replace-me' ]; then
              missing+=("${pair%%=*}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Fill ${missing[*]} in cloudflare.enc.env (sops edit cloudflare.enc.env)"
            exit 1
          fi

          echo "::add-mask::${token}"
          {
            echo "CLOUDFLARE_API_TOKEN=${token}"
            echo "CLOUDFLARE_ACCOUNT_ID=${account_id}"
          } >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NODE_ENV: production
          VITE_GOOGLE_CLIENT_ID: 98028024074-s9nmhn3raqgrod8p2sskt0omq9u591o8.apps.googleusercontent.com
          VITE_CF_ANALYTICS_TOKEN: 777257fb8ec744b689c5462d2f755fae
        run: pnpm nx build "${{ matrix.project }}" --skip-nx-cache

      - name: Prerender
        if: matrix.prerender
        working-directory: apps/frontend
        run: |
          pnpm exec playwright install --with-deps chromium
          node tools/prerender.mjs

      - name: Deploy to Cloudflare
        working-directory: apps/${{ matrix.app }}
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy
