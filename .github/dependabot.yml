version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'scope/deps'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    versioning-strategy: 'increase'
    ignore:
      # config@5 chỉ có entry CommonJS gọi `require()` vào file ESM, mà loader hàm của Vercel
      # không hỗ trợ `require(esm)` — hàm chết lúc load. Xem PR #16 và #26.
      - dependency-name: 'config'
        versions: ['>=5']
      # @nestjs/typeorm@12 bỏ hẳn entry CommonJS, chỉ còn ESM. Backend chạy Jest dạng CJS nên toàn bộ
      # suite backend và server e2e chết ngay lúc load module. Xem PR #41.
      - dependency-name: '@nestjs/typeorm'
        versions: ['>=12']
    groups:
      # nx và mọi @nx/* phải cùng version; lệch một patch là Nx không load được plugin. Xem PR #47.
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      # Các gói @bull-board/* dùng chung type từ @bull-board/api; bump lẻ một gói là typecheck vỡ. Xem PR #42.
      bull-board:
        patterns:
          - '@bull-board/*'
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'scope/ci'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/apps/backend'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'scope/infra'
    commit-message:
      prefix: 'build'
      include: 'scope'

  - package-ecosystem: 'docker'
    directory: '/apps/frontend'
    target-branch: 'dev'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
      - 'scope/infra'
    commit-message:
      prefix: 'build'
      include: 'scope'
