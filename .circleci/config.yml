version: 2.1

# The canonical CI runs on GitHub Actions (.github/workflows/pull-request.yml).
# This pipeline mirrors its core verification (format, lint, typecheck, test, build)
# so the CircleCI integration attached to this repo reports a real, passing status.

jobs:
  verify:
    docker:
      - image: cimg/node:lts
    steps:
      - checkout

      - run:
          name: Enable Corepack (pins pnpm from package.json packageManager)
          command: |
            corepack enable
            pnpm config set store-dir .pnpm-store

      - restore_cache:
          keys:
            - pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-v1-

      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile

      - save_cache:
          key: pnpm-store-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - .pnpm-store

      - run:
          name: Format check
          command: pnpm nx format:check

      - run:
          name: Lint
          command: pnpm nx run-many -t lint -- --max-warnings=0

      - run:
          name: Typecheck
          command: pnpm nx run-many -t typecheck

      - run:
          name: Test
          command: pnpm nx run-many -t test

      - run:
          name: Build
          command: pnpm nx run-many -t build

workflows:
  pull-request:
    jobs:
      - verify
