<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Tử Vi · Bảng điều khiển</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Ma+Shan+Zheng&display=swap"
    />
    <script>
      // Set the theme class before first paint so there is no light/dark flash. Default: day (light).
      (function () {
        try {
          if (localStorage.getItem('tuvi-admin-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* default to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
