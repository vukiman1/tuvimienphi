# Only values that differ per deployment. Everything constant lives in default.yml —
# nothing here is secret anyway, since the whole object is inlined into the browser bundle.

app:
  # Kept so a preview or staging deploy can tag itself without a separate build config.
  environment: VITE_APP_ENVIRONMENT

api:
  baseUrl: VITE_API_BASE_URL

media:
  baseUrl: VITE_MEDIA_BASE_URL

sentry:
  dsn: VITE_SENTRY_DSN

google:
  clientId: VITE_GOOGLE_CLIENT_ID
