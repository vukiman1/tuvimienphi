<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tử Vi Miễn Phí</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(160deg, #131315 0%, #26241f 55%, #17171a 100%);
        transition: opacity 400ms ease;
      }
      .app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-icon {
        width: 72px;
        height: 72px;
        animation: app-splash-spin 6s linear infinite;
      }
      .app-splash-logo {
        width: min(260px, 60vw);
        height: auto;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-icon {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" class="app-splash">
      <img class="app-splash-icon" src="/icon.png" alt="" />
      <img class="app-splash-logo" src="/logo.png" alt="Tử Vi Miễn Phí" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
