<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <!-- Title is set per-route via TanStack Router `head` and baked into the static HTML by the
         prerender step. A shell title element here would duplicate it on every page, so it is omitted. -->
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: var(--color-night);
        color: var(--color-day);
        font-family: var(--font-sans);
        transition: opacity 400ms ease;
      }
      .app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      .app-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .app-splash-logo {
        display: flex;
        align-items: center;
        gap: 0.28em;
        font-family: var(--font-display);
        font-size: clamp(2rem, 7vw, 3.5rem);
        font-weight: 800;
        letter-spacing: var(--tracking-display);
        word-spacing: 0.12em;
        white-space: nowrap;
      }
      .app-splash-logo img {
        width: 1.3em;
        height: 1.3em;
      }
      .app-splash-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.625rem;
      }
      .app-splash-label {
        margin: 0;
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: var(--color-gold);
      }
      .app-splash-track {
        position: relative;
        width: min(21rem, 64vw);
        height: 0.1875rem;
        border-radius: 999px;
        background: color-mix(in srgb, var(--color-gold) 20%, transparent);
        overflow: hidden;
      }
      .app-splash-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 6%;
        border-radius: inherit;
        background: var(--color-gold);
        animation: app-splash-fill 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes app-splash-fill {
        from {
          width: 6%;
        }
        to {
          width: 94%;
        }
      }
      .app-splash-hint {
        margin: 0;
        font-size: 0.8125rem;
        color: var(--color-day-soft);
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-fill {
          animation: none;
          width: 60%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" class="app-splash">
      <div class="app-splash-content">
        <div class="app-splash-logo" role="img" aria-label="Tử Vi Miễn Phí">
          <img src="/brand/logo-mark-256.webp" alt="" width="128" height="128" />
          <span>Tử Vi Miễn Phí</span>
        </div>
        <div class="app-splash-loading">
          <p class="app-splash-label">Đang tải</p>
          <div class="app-splash-track" role="progressbar" aria-label="Đang tải">
            <span class="app-splash-fill"></span>
          </div>
          <p class="app-splash-hint">Xin chờ trong giây lát…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
