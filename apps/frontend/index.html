<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tử Vi Miễn Phí</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/brand/icon.png" />
    <link rel="apple-touch-icon" href="/brand/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>
      .app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #000;
        font-family: 'Cormorant Garamond', ui-serif, Georgia, serif;
        transition: opacity 400ms ease;
      }
      .app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Absolute, so the content above needs its own stacking context to stay on top. */
      .app-splash-peak {
        position: absolute;
        bottom: 0;
        width: min(560px, 48vw);
        height: auto;
        opacity: 0.32;
        filter: blur(2px);
        pointer-events: none;
        user-select: none;
      }
      .app-splash-peak--left {
        left: 0;
      }
      .app-splash-peak--right {
        right: 0;
      }
      .app-splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 34px;
      }
      .app-splash-logo {
        width: min(560px, 82vw);
        height: auto;
      }
      .app-splash-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .app-splash-label {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: #c9a15c;
      }
      .app-splash-track {
        position: relative;
        width: min(340px, 64vw);
        height: 3px;
        border-radius: 999px;
        background: rgba(201, 161, 92, 0.2);
        overflow: hidden;
      }
      /* Indeterminate on purpose: nothing here can measure real progress, so no number is shown. */
      .app-splash-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 6%;
        border-radius: inherit;
        background: linear-gradient(90deg, #8a6320 0%, #f0d79a 70%, #fff6dd 100%);
        box-shadow: 0 0 12px rgba(240, 215, 154, 0.75);
        animation: app-splash-fill 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes app-splash-fill {
        from {
          width: 6%;
        }
        to {
          width: 94%;
        }
      }
      .app-splash-hint {
        margin: 0;
        font-size: 13px;
        color: rgba(240, 231, 210, 0.5);
      }
      @media (prefers-reduced-motion: reduce) {
        .app-splash-fill {
          animation: none;
          width: 60%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-splash" class="app-splash">
      <img class="app-splash-peak app-splash-peak--left" src="/splash/peak-left.webp" alt="" />
      <img class="app-splash-peak app-splash-peak--right" src="/splash/peak-right.webp" alt="" />
      <div class="app-splash-content">
        <img
          class="app-splash-logo"
          src="/splash/logo.webp"
          alt="Tử Vi Miễn Phí"
          fetchpriority="high"
        />
        <div class="app-splash-loading">
          <p class="app-splash-label">Đang tải</p>
          <div class="app-splash-track" role="progressbar" aria-label="Đang tải">
            <span class="app-splash-fill"></span>
          </div>
          <p class="app-splash-hint">Xin chờ trong giây lát…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
