# Only secrets and per-deployment infrastructure belong here. Tuning values (TTLs, log levels,
# sample rates, feature flags) live in default.yml and production.yml — an env var for them just
# adds a second place to look.
#
# db.tls, redis.tls and redis.db look like plain toggles but must stay: connection-urls.ts derives
# them from DATABASE_URL / REDIS_URL, so dropping the mapping would silently disable TLS on a
# managed provider.

app:
  port:
    __name: PORT
    __format: number
  nodeEnv: NODE_ENV
  url: APP_URL

db:
  primary:
    host: DB_HOST
    port:
      __name: DB_PORT
      __format: number
  username: DB_USERNAME
  password: DB_PASSWORD
  database: DB_NAME
  tls:
    __name: DB_TLS
    __format: boolean

redis:
  host: REDIS_HOST
  port:
    __name: REDIS_PORT
    __format: number
  password: REDIS_PASSWORD
  db:
    __name: REDIS_DB
    __format: number
  tls:
    __name: REDIS_TLS
    __format: boolean

sentry:
  dsn: SENTRY_DSN

cors:
  origins: CORS_ORIGINS

jwt:
  secret: JWT_SECRET

crypto:
  secretKey: SECRET_KEY

email:
  resendApiKey: RESEND_API_KEY
  from: EMAIL_FROM

captcha:
  secretKey: CAPTCHA_SECRET_KEY

google:
  clientId: GOOGLE_CLIENT_ID

queueBoard:
  enabled:
    __name: QUEUE_BOARD_ENABLED
    __format: boolean
  user: QUEUE_BOARD_USER
  password: QUEUE_BOARD_PASSWORD
