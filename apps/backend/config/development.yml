# Everything else matches default.yml; repeating it here only invites the two to drift apart.
app:
  logLevels:
    - error
    - warn
    - log

# The dev deployment's frontend, alongside a local Vite server. Whole arrays are replaced rather
# than merged, so both origins have to be listed here and local.yml must leave cors alone.
cors:
  origins:
    - http://localhost:4200
    - https://tuvimienphi-frontend.vercel.app
