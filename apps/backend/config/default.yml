# Values that hold everywhere. Anything machine-specific (localhost hosts, dev credentials) lives
# in local.yml; production takes those from environment variables instead.

app:
  name: Tu Vi Mien Phi
  port: 3000
  nodeEnv: development
  trustProxy: 0
  logLevels:
    - error
    - warn
    - log
    - debug
    - verbose

db:
  replicas: []
  log:
    enabled: true

redis:
  cluster: false
  db: 0

sentry:
  dsn: ''
  tracesSampleRate: 0.1

jwt:
  accessTokenExpiresIn: 15m

email:
  resendApiKey: ''
  from: Tu Vi Mien Phi <onboarding@resend.dev>

session:
  maxSessionsPerUser: 5
  refreshTtl: 1d
  refreshTtlRemember: 60d
  refreshTtlOauth: 30d

captcha:
  enabled: false
  secretKey: ''

google:
  clientId: ''

queueBoard:
  enabled: true
  user: admin
  password: ''
