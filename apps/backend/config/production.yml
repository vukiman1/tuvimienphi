app:
  nodeEnv: production
  # The deployed frontend. Not a secret, so it lives here rather than costing an env var; the
  # CORS_ORIGINS / APP_URL mappings still win, for when a custom domain arrives.
  url: https://tuvimienphi-frontend.vercel.app
  trustProxy: 1
  logLevels:
    - error
    - warn
    - log

db:
  tls: true
  log:
    enabled: false

redis:
  tls: true

cors:
  origins:
    - https://tuvimienphi-frontend.vercel.app
