app:
  nodeEnv: production
  # The deployed frontend. Not a secret, so it lives here rather than costing an env var; the
  # CORS_ORIGINS / APP_URL mappings still win, for when a custom domain arrives.
  url: https://tuvimienphi-frontend.vercel.app
  trustProxy: 1
  logLevels:
    - error
    - warn
    - log

db:
  tls: true
  log:
    enabled: false

redis:
  tls: true

cors:
  origins:
    - https://tuvimienphi-frontend.vercel.app

# The dashboard only makes sense next to a running worker, and BullMQ workers need a process that
# stays alive — a serverless function is not one. Mounting it also drags @bull-board/ui into the
# bundle through an eval'd require the file tracer cannot follow, which crashes the function.
queueBoard:
  enabled: false
