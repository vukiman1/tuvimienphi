name: ${COMPOSE_PROJECT_NAME:-tuvimienphi-prod}

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-tuvimienphi-backend:latest}
  build:
    context: .
    dockerfile: apps/backend/Dockerfile

x-backend-env: &backend-env
  APP_URL: ${APP_URL:?set APP_URL to the public frontend origin}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to the origins allowed to call this API}
  DB_HOST: db
  DB_PORT: '5432'
  DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
  DB_TLS: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
  REDIS_DB: '0'
  REDIS_TLS: 'false'
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY to exactly 32 characters}
  SENTRY_DSN: ${SENTRY_DSN:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-Tu Vi Mien Phi <onboarding@resend.dev>}
  CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  QUEUE_BOARD_ENABLED: ${QUEUE_BOARD_ENABLED:-false}
  QUEUE_BOARD_USER: ${QUEUE_BOARD_USER:-admin}
  QUEUE_BOARD_PASSWORD: ${QUEUE_BOARD_PASSWORD:-}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=96MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=32MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    mem_limit: 384m
    shm_size: 128mb
    ports:
      - '127.0.0.1:${DB_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --appendonly
      - 'yes'
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    mem_limit: 192m
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    <<: *backend-image
    restart: 'no'
    logging: *logging
    command: ['node', './node_modules/typeorm/cli.js', '-d', './ormconfigs.js', 'migration:run']
    environment: *backend-env
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend-image
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *backend-env
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 640m
    ports:
      - '127.0.0.1:${BACKEND_HOST_PORT:-3000}:3000'
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/readiness').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    profiles: ['tunnel']
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    logging: *logging
    command: ['tunnel', '--no-autoupdate', '--protocol', 'http2', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    mem_limit: 96m
    depends_on:
      backend:
        condition: service_healthy

  db-backup:
    profiles: ['backup']
    image: ${PG_BACKUP_IMAGE:-ghcr.io/vukiman1/tuvimienphi-pg-backup:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-}
    mem_limit: 192m
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
